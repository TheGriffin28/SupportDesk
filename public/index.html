<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupportDesk — Modern Ticket Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const PRIORITY_COLORS = {
      Low: 'bg-slate-800 text-slate-300 border-slate-700',
      Medium: 'bg-blue-500/10 text-blue-400 border-blue-500/20',
      High: 'bg-amber-500/10 text-amber-400 border-amber-500/20',
      Urgent: 'bg-rose-500/10 text-rose-400 border-rose-500/20 animate-pulse',
    };

    const STATUS_COLORS = {
      Open: 'bg-sky-500/10 text-sky-400 border-sky-500/20',
      'In Progress': 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20',
      Resolved: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
      Closed: 'bg-slate-800 text-slate-400 border-slate-700',
    };

    function App() {
      const [tickets, setTickets] = useState([]);
      const [pagination, setPagination] = useState({ total: 0, page: 1, limit: 10, totalPages: 1 });
      const [stats, setStats] = useState({ total: 0, open: 0, inProgress: 0, resolved: 0, closed: 0 });
      const [statusFilter, setStatusFilter] = useState('All');
      const [priorityFilter, setPriorityFilter] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [isCreateOpen, setIsCreateOpen] = useState(false);
      const [activeTicket, setActiveTicket] = useState(null);
      const [loading, setLoading] = useState(true);

      // New Ticket Form State
      const [formData, setFormData] = useState({
        customerName: '',
        customerEmail: '',
        subject: '',
        description: '',
        priority: 'Medium',
        status: 'Open'
      });
      const [formErrors, setFormErrors] = useState({});

      const fetchTickets = async () => {
        setLoading(true);
        try {
          const params = new URLSearchParams({
            page: pagination.page,
            limit: pagination.limit,
            status: statusFilter,
            priority: priorityFilter,
            search: searchQuery
          });
          const res = await fetch(`/api/tickets?${params.toString()}`);
          const data = await res.json();
          setTickets(data.tickets || []);
          if (data.pagination) setPagination(data.pagination);

          const statsRes = await fetch('/api/stats');
          const statsData = await statsRes.json();
          setStats(statsData);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchTickets();
      }, [pagination.page, statusFilter, priorityFilter, searchQuery]);

      const handleCreateSubmit = async (e) => {
        e.preventDefault();
        const errors = {};
        if (!formData.customerName.trim()) errors.customerName = 'Customer name is required';
        if (!formData.customerEmail.trim() || !formData.customerEmail.includes('@')) errors.customerEmail = 'Valid email is required';
        if (!formData.subject.trim()) errors.subject = 'Subject is required';
        if (!formData.description.trim()) errors.description = 'Description is required';

        if (Object.keys(errors).length > 0) {
          setFormErrors(errors);
          return;
        }

        try {
          const res = await fetch('/api/tickets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          if (res.ok) {
            setIsCreateOpen(false);
            setFormData({ customerName: '', customerEmail: '', subject: '', description: '', priority: 'Medium', status: 'Open' });
            setFormErrors({});
            fetchTickets();
          } else {
            const err = await res.json();
            alert(err.error || 'Failed to create ticket');
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleStatusChange = async (id, newStatus) => {
        try {
          await fetch(`/api/tickets/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus })
          });
          fetchTickets();
          if (activeTicket && activeTicket.id === id) {
            setActiveTicket(prev => ({ ...prev, status: newStatus }));
          }
        } catch (e) {
          console.error(e);
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Are you sure you want to delete this ticket?')) return;
        try {
          await fetch(`/api/tickets/${id}`, { method: 'DELETE' });
          if (activeTicket && activeTicket.id === id) setActiveTicket(null);
          fetchTickets();
        } catch (e) {
          console.error(e);
        }
      };

      return (
        <div class="min-h-screen flex flex-col">
          {/* Top Navbar */}
          <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                  <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" />
                  </svg>
                </div>
                <div>
                  <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                    SupportDesk
                    <span class="text-xs py-0.5 px-2 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-medium">Enterprise</span>
                  </h1>
                  <p class="text-xs text-slate-400">Customer Support Ticket Management</p>
                </div>
              </div>

              <div class="flex items-center gap-3">
                <button
                  onClick={() => setIsCreateOpen(true)}
                  class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition-all flex items-center gap-2"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                  </svg>
                  New Ticket
                </button>
              </div>
            </div>
          </header>

          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
            {/* KPI Cards Grid */}
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-4">
              <div class="glass p-4 rounded-2xl">
                <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Tickets</div>
                <div class="text-2xl font-extrabold text-white mt-1">{stats.total}</div>
              </div>
              <div class="glass p-4 rounded-2xl border-l-4 border-sky-500">
                <div class="text-xs font-semibold uppercase tracking-wider text-sky-400">Open</div>
                <div class="text-2xl font-extrabold text-white mt-1">{stats.open}</div>
              </div>
              <div class="glass p-4 rounded-2xl border-l-4 border-indigo-500">
                <div class="text-xs font-semibold uppercase tracking-wider text-indigo-400">In Progress</div>
                <div class="text-2xl font-extrabold text-white mt-1">{stats.inProgress}</div>
              </div>
              <div class="glass p-4 rounded-2xl border-l-4 border-emerald-500">
                <div class="text-xs font-semibold uppercase tracking-wider text-emerald-400">Resolved</div>
                <div class="text-2xl font-extrabold text-white mt-1">{stats.resolved}</div>
              </div>
              <div class="glass p-4 rounded-2xl border-l-4 border-slate-600">
                <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Closed</div>
                <div class="text-2xl font-extrabold text-white mt-1">{stats.closed}</div>
              </div>
            </div>

            {/* Filter and Search Bar */}
            <div class="glass p-4 rounded-2xl flex flex-col md:flex-row gap-4 items-center justify-between">
              <div class="relative w-full md:w-96">
                <input
                  type="text"
                  placeholder="Search subject or customer name..."
                  value={searchQuery}
                  onChange={(e) => { setSearchQuery(e.target.value); setPagination(p => ({ ...p, page: 1 })); }}
                  class="w-full bg-slate-900/90 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                />
                <svg class="w-4 h-4 text-slate-500 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
              </div>

              <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <div class="flex items-center gap-2">
                  <span class="text-xs text-slate-400 font-medium">Status:</span>
                  <select
                    value={statusFilter}
                    onChange={(e) => { setStatusFilter(e.target.value); setPagination(p => ({ ...p, page: 1 })); }}
                    class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                  >
                    <option value="All">All Statuses</option>
                    <option value="Open">Open</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                    <option value="Closed">Closed</option>
                  </select>
                </div>

                <div class="flex items-center gap-2">
                  <span class="text-xs text-slate-400 font-medium">Priority:</span>
                  <select
                    value={priorityFilter}
                    onChange={(e) => { setPriorityFilter(e.target.value); setPagination(p => ({ ...p, page: 1 })); }}
                    class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                  >
                    <option value="All">All Priorities</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                    <option value="Urgent">Urgent</option>
                  </select>
                </div>

                {(statusFilter !== 'All' || priorityFilter !== 'All' || searchQuery) && (
                  <button
                    onClick={() => { setStatusFilter('All'); setPriorityFilter('All'); setSearchQuery(''); }}
                    class="text-xs text-indigo-400 hover:text-indigo-300 font-medium underline"
                  >
                    Clear Filters
                  </button>
                )}
              </div>
            </div>

            {/* Tickets Table */}
            <div class="glass rounded-2xl overflow-hidden shadow-2xl">
              <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                  <thead class="bg-slate-900/80 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-800">
                    <tr>
                      <th class="py-3.5 px-4 font-semibold">ID</th>
                      <th class="py-3.5 px-4 font-semibold">Subject & Customer</th>
                      <th class="py-3.5 px-4 font-semibold">Priority</th>
                      <th class="py-3.5 px-4 font-semibold">Status</th>
                      <th class="py-3.5 px-4 font-semibold">Created</th>
                      <th class="py-3.5 px-4 font-semibold text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60">
                    {loading ? (
                      <tr>
                        <td colSpan="6" class="text-center py-12 text-slate-500">
                          <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-500"></div>
                          <p class="mt-2 text-xs">Loading tickets...</p>
                        </td>
                      </tr>
                    ) : tickets.length === 0 ? (
                      <tr>
                        <td colSpan="6" class="text-center py-16 text-slate-500">
                          <p class="text-base font-semibold text-slate-400">No tickets found</p>
                          <p class="text-xs mt-1">Try adjusting your search or filters</p>
                        </td>
                      </tr>
                    ) : (
                      tickets.map(ticket => (
                        <tr key={ticket.id} class="hover:bg-slate-900/40 transition group">
                          <td class="py-4 px-4 font-mono text-xs text-slate-400">
                            #{String(ticket.id).padStart(4, '0')}
                          </td>
                          <td class="py-4 px-4">
                            <div
                              onClick={() => setActiveTicket(ticket)}
                              class="font-semibold text-white hover:text-indigo-400 cursor-pointer transition flex items-center gap-2"
                            >
                              {ticket.subject}
                            </div>
                            <div class="text-xs text-slate-400 mt-0.5 flex items-center gap-2">
                              <span>{ticket.customerName}</span>
                              <span class="text-slate-600">•</span>
                              <span class="text-slate-500 font-mono text-[11px]">{ticket.customerEmail}</span>
                            </div>
                          </td>
                          <td class="py-4 px-4">
                            <span class={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${PRIORITY_COLORS[ticket.priority] || ''}`}>
                              {ticket.priority}
                            </span>
                          </td>
                          <td class="py-4 px-4">
                            <select
                              value={ticket.status}
                              onChange={(e) => handleStatusChange(ticket.id, e.target.value)}
                              class={`text-xs font-semibold px-2.5 py-1 rounded-full border cursor-pointer focus:outline-none ${STATUS_COLORS[ticket.status] || ''} bg-slate-950/80`}
                            >
                              <option value="Open">Open</option>
                              <option value="In Progress">In Progress</option>
                              <option value="Resolved">Resolved</option>
                              <option value="Closed">Closed</option>
                            </select>
                          </td>
                          <td class="py-4 px-4 text-xs text-slate-400">
                            {new Date(ticket.createdAt).toLocaleDateString()}
                          </td>
                          <td class="py-4 px-4 text-right space-x-2">
                            <button
                              onClick={() => setActiveTicket(ticket)}
                              class="p-1.5 text-slate-400 hover:text-indigo-400 rounded-lg hover:bg-slate-800 transition"
                              title="View Details"
                            >
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                              </svg>
                            </button>
                            <button
                              onClick={() => handleDelete(ticket.id)}
                              class="p-1.5 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-800 transition"
                              title="Delete Ticket"
                            >
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                              </svg>
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>

              {/* Pagination Bar */}
              <div class="border-t border-slate-800/80 px-4 py-3 bg-slate-900/40 flex items-center justify-between">
                <div class="text-xs text-slate-400">
                  Showing <span class="font-semibold text-white">{tickets.length > 0 ? (pagination.page - 1) * pagination.limit + 1 : 0}</span> to{' '}
                  <span class="font-semibold text-white">{Math.min(pagination.page * pagination.limit, pagination.total)}</span> of{' '}
                  <span class="font-semibold text-white">{pagination.total}</span> tickets
                </div>
                <div class="flex items-center gap-2">
                  <button
                    disabled={pagination.page <= 1}
                    onClick={() => setPagination(p => ({ ...p, page: p.page - 1 }))}
                    class="px-3 py-1.5 rounded-lg border border-slate-800 bg-slate-900 text-xs font-medium text-slate-300 hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed transition"
                  >
                    Previous
                  </button>
                  <span class="text-xs text-slate-400 px-2 font-mono">
                    {pagination.page} / {pagination.totalPages}
                  </span>
                  <button
                    disabled={pagination.page >= pagination.totalPages}
                    onClick={() => setPagination(p => ({ ...p, page: p.page + 1 }))}
                    class="px-3 py-1.5 rounded-lg border border-slate-800 bg-slate-900 text-xs font-medium text-slate-300 hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed transition"
                  >
                    Next
                  </button>
                </div>
              </div>
            </div>
          </main>

          {/* Create Ticket Modal */}
          {isCreateOpen && (
            <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="glass max-w-lg w-full rounded-2xl p-6 shadow-2xl border border-slate-700/60 relative">
                <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                  <h3 class="text-lg font-bold text-white">Create New Ticket</h3>
                  <button onClick={() => setIsCreateOpen(false)} class="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleCreateSubmit} class="mt-4 space-y-4">
                  <div class="grid grid-cols-2 gap-4">
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 mb-1">Customer Name *</label>
                      <input
                        type="text"
                        value={formData.customerName}
                        onChange={(e) => setFormData({ ...formData, customerName: e.target.value })}
                        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        placeholder="John Doe"
                      />
                      {formErrors.customerName && <p class="text-xs text-rose-400 mt-1">{formErrors.customerName}</p>}
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 mb-1">Customer Email *</label>
                      <input
                        type="email"
                        value={formData.customerEmail}
                        onChange={(e) => setFormData({ ...formData, customerEmail: e.target.value })}
                        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                        placeholder="john@example.com"
                      />
                      {formErrors.customerEmail && <p class="text-xs text-rose-400 mt-1">{formErrors.customerEmail}</p>}
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Subject *</label>
                    <input
                      type="text"
                      value={formData.subject}
                      onChange={(e) => setFormData({ ...formData, subject: e.target.value })}
                      class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                      placeholder="Summary of the issue"
                    />
                    {formErrors.subject && <p class="text-xs text-rose-400 mt-1">{formErrors.subject}</p>}
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Description *</label>
                    <textarea
                      rows="3"
                      value={formData.description}
                      onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                      class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                      placeholder="Full details regarding the customer problem..."
                    ></textarea>
                    {formErrors.description && <p class="text-xs text-rose-400 mt-1">{formErrors.description}</p>}
                  </div>

                  <div class="grid grid-cols-2 gap-4">
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 mb-1">Priority</label>
                      <select
                        value={formData.priority}
                        onChange={(e) => setFormData({ ...formData, priority: e.target.value })}
                        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                      >
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 mb-1">Status</label>
                      <select
                        value={formData.status}
                        onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                      >
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                        <option value="Closed">Closed</option>
                      </select>
                    </div>
                  </div>

                  <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setIsCreateOpen(false)}
                      class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold shadow-lg shadow-indigo-600/30 transition"
                    >
                      Create Ticket
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Ticket Detail Drawer/Modal */}
          {activeTicket && (
            <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="glass max-w-lg w-full rounded-2xl p-6 shadow-2xl border border-slate-700/60">
                <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                  <div class="flex items-center gap-3">
                    <span class="font-mono text-xs text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">
                      #{String(activeTicket.id).padStart(4, '0')}
                    </span>
                    <span class={`text-xs px-2.5 py-0.5 rounded-full border ${PRIORITY_COLORS[activeTicket.priority]}`}>
                      {activeTicket.priority}
                    </span>
                  </div>
                  <button onClick={() => setActiveTicket(null)} class="text-slate-400 hover:text-white">✕</button>
                </div>

                <div class="mt-4 space-y-4">
                  <div>
                    <h3 class="text-lg font-bold text-white">{activeTicket.subject}</h3>
                    <p class="text-xs text-slate-400 mt-1">
                      Submitted by <strong class="text-slate-200">{activeTicket.customerName}</strong> ({activeTicket.customerEmail})
                    </p>
                  </div>

                  <div class="bg-slate-900/90 rounded-xl p-4 border border-slate-800">
                    <div class="text-xs font-semibold uppercase text-slate-400 mb-1">Description</div>
                    <p class="text-sm text-slate-200 whitespace-pre-wrap leading-relaxed">{activeTicket.description}</p>
                  </div>

                  <div class="grid grid-cols-2 gap-4 text-xs">
                    <div>
                      <div class="text-slate-500">Created At</div>
                      <div class="text-slate-300 font-mono mt-0.5">{new Date(activeTicket.createdAt).toLocaleString()}</div>
                    </div>
                    <div>
                      <div class="text-slate-500">Last Updated</div>
                      <div class="text-slate-300 font-mono mt-0.5">{new Date(activeTicket.updatedAt).toLocaleString()}</div>
                    </div>
                  </div>

                  <div class="flex items-center justify-between pt-4 border-t border-slate-800">
                    <div class="flex items-center gap-2">
                      <span class="text-xs text-slate-400">Update Status:</span>
                      <select
                        value={activeTicket.status}
                        onChange={(e) => handleStatusChange(activeTicket.id, e.target.value)}
                        class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none"
                      >
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                        <option value="Closed">Closed</option>
                      </select>
                    </div>

                    <button
                      onClick={() => setActiveTicket(null)}
                      class="px-4 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-white font-medium transition"
                    >
                      Close
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
