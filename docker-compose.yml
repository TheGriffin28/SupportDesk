version: '3.8'

services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: supportdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supportdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SupportDesk Full-Stack Application
  app:
    build: .
    container_name: supportdesk-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/supportdesk
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
